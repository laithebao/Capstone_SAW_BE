name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tools/SAW.Testing -- test --profile unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.os }}
          path: test-results/unit/
  integration:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tools/SAW.Testing -- init
      - run: dotnet run --project tools/SAW.Testing -- setup --docker --profile integration
      - run: dotnet run --project tools/SAW.Testing -- test --profile integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-linux
          path: test-results/integration/
